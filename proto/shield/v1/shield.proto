syntax = "proto3";

package shield.v1;

option go_package = "github.com/yourorg/ztna/controller/gen/go/proto/shield/v1;shieldv1";

service ShieldService {
  // Called once during enrollment.
  // Uses plain TLS — shield has no cert yet.
  // Shield presents enrollment JWT + PKCS#10 CSR.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Persistent bidirectional control stream.
  // Shield establishes stream on startup; connector pushes resource
  // instructions in real time; shield streams health reports and acks back.
  // Uses mTLS — shield presents its SPIFFE-certified cert.
  rpc Control(stream ShieldControlMessage) returns (stream ShieldControlMessage);

  // Called when re_enroll arrives on the Control stream.
  // Uses mTLS — shield presents its current (still-valid) cert.
  rpc RenewCert(RenewCertRequest) returns (RenewCertResponse);

  // Called by shield during best-effort graceful shutdown.
  rpc Goodbye(GoodbyeRequest) returns (GoodbyeResponse);
}

message EnrollRequest {
  string enrollment_token = 1; // signed JWT — single-use enrollment token
  bytes csr_der = 2; // DER-encoded PKCS#10 CSR (EC P-384)
  string version = 3; // CARGO_PKG_VERSION
  string hostname = 4;
}

message EnrollResponse {
  bytes certificate_pem = 1; // signed leaf cert — 7-day validity, SPIFFE SAN
  bytes workspace_ca_pem = 2; // WorkspaceCA cert (PEM)
  bytes intermediate_ca_pem = 3; // Intermediate CA cert (PEM)
  string shield_id = 4; // confirmed shield UUID
  string interface_addr = 5; // assigned zecurity0 /32
  string connector_addr = 6; // selected connector Shield gRPC addr
  string connector_id = 7; // confirmed connector UUID
}

message ResourceInstruction {
  string resource_id = 1;
  string host = 2; // must match shield's lan_ip
  string protocol = 3; // "tcp", "udp", "any"
  int32 port_from = 4;
  int32 port_to = 5;
  string action = 6; // "apply" or "remove"
}

message ResourceAck {
  string resource_id = 1;
  string status = 2; // "protected", "failed", "removed"
  string error = 3; // set only on failure
  int64 verified_at = 4; // unix timestamp of last port check
  bool port_reachable = 5;
  // Sprint 20 Fix 18: what the ack is about, so the controller can ignore a
  // stale one. shield_id is overwritten by the connector with the shield's
  // verified (mTLS) identity; the rule fields echo what the shield enforces.
  string shield_id = 6;
  string host = 7;
  string protocol = 8;
  int32 port_from = 9;
  int32 port_to = 10;
}

// Complete desired resource set for this shield (ADR-004 Phase 2).
// Replace-semantics: on receipt the shield sets its active set to exactly
// this list and rebuilds the resource_protect chain — anything absent is dropped.
message ResourceSnapshot {
  repeated ResourceInstruction resources = 1; // action is implicitly "apply"
  uint64 generation = 2; // monotonic per Connector; shield ignores snapshots older than the last applied (D21-R a1)
  // D21-R (a2): the shield's peer Connectors, signed by the controller. The
  // shield's only source of peers; processed before, and independently of,
  // the generation check. Absent when the controller could not sign one.
  SignedPeerList signed_peer_list = 3;
}

// D21-R (a2): a controller-signed peer list. `payload` is a serialized
// PeerListPayload; `signature` is ECDSA P-384 / SHA-384 (ASN.1 DER) by the
// Workspace CA key over "zecurity/shield-peer-list/v1\0" || payload. A
// Connector can withhold or replay one, never forge or alter it.
message SignedPeerList {
  bytes payload = 1;
  bytes signature = 2;
}

message PeerListPayload {
  string trust_domain = 1;
  string shield_id = 2; // the one shield this list is for
  uint64 issued_at_unix_ms = 3; // the shield accepts only a later list than the last it accepted
  repeated PeerConnector peers = 4; // every non-revoked Connector of the shield's Remote Network
}

// Shield → Connector: the shield's actual enforced state (ADR-004 Phase 3).
// Sent on every heartbeat so the controller can reconcile observed vs desired
// state (orphan removal, missing re-apply, confirmation-gated tombstone reap).
message ResourceStateReport {
  string shield_id = 1;
  uint64 generation = 2; // session-local seq, bumped on every active-set mutation
  repeated string active_resource_ids = 3; // sorted
  uint64 fingerprint = 4; // hash over the sorted id list — cheap no-change check
}

message RenewCertRequest {
  string shield_id = 1; // for logging only — identity comes from mTLS cert
  bytes public_key_der = 2; // shield's existing EC P-384 public key (DER)
}

message RenewCertResponse {
  bytes certificate_pem = 1; // fresh 7-day cert, same SPIFFE SAN
  bytes workspace_ca_pem = 2; // WorkspaceCA (may not have changed, but send anyway)
  bytes intermediate_ca_pem = 3; // Intermediate CA
}

message GoodbyeRequest {
  string shield_id = 1;
}

message GoodbyeResponse {
  bool ok = 1;
}

// ── Control stream messages ──────────────────────────────────────────────────

message ShieldControlMessage {
  oneof body {
    // Connector → Shield
    ResourceInstruction resource_instruction = 1;
    ReEnrollSignal re_enroll = 2;
    Ping ping = 3;
    // Shield → Connector
    ShieldHealthReport health_report = 4;
    ResourceAck resource_ack = 5;
    Pong pong = 6;
    DiscoveryReport discovery_report = 7;
    // Connector → Shield
    TunnelOpen tunnel_open = 8;
    // Shield → Connector
    TunnelOpened tunnel_opened = 9;
    // Bidirectional
    TunnelData tunnel_data = 10;
    TunnelClose tunnel_close = 11;
    // Connector → Shield
    ResourceSnapshot resource_snapshot = 12;
    // Shield → Connector
    ResourceStateReport resource_state = 13;
    // Connector → Shield — peer-Connector list piggybacked after every
    // ShieldHealthReport. Lets the Shield fail over to a sibling Connector
    // on the same Remote Network when this one goes down. See ADR (TODO).
    PeerConnectorList peer_connector_list = 14;
    // Connector → Shield — D21-R A′: the workspace CRL, forwarded when the
    // stream opens and whenever the Connector has a newer one.
    WorkspaceCrl workspace_crl = 15;
  }
}

// D21-R A′: the DER workspace CRL (/ca.crl) as the Connector fetched it,
// signed by the Workspace CA. The Shield verifies it, keeps the newest one
// (latest thisUpdate) and leaves a Connector whose certificate it lists, or
// when it holds no CRL that is still before its nextUpdate.
message WorkspaceCrl {
  bytes crl_der = 1;
}

// PeerConnectorList tells the Shield which Connectors on its own Remote
// Network are currently available. The Connector emits this every time it
// sees a ShieldHealthReport, reading its own ACL snapshot. Empty `peers` is
// ignored by the Shield (its current list is kept as-is).
message PeerConnectorList {
  repeated PeerConnector peers = 1;
  // Connector-revocation Phase E (D21): connector ids the sender's ACL lists
  // as revoked. The Shield prunes them at once and never re-adds them while
  // it runs. Sent even when `peers` is empty.
  repeated string revoked_connector_ids = 2;
}

message PeerConnector {
  string connector_id   = 1;
  string connector_addr = 2; // host:9091 gRPC address for the Shield to dial
}

message TunnelOpen {
  string connection_id = 1; // UUID identifying this tunnel session
  string destination = 2; // target IP or hostname
  uint32 port = 3;
  string protocol = 4; // "tcp" or "udp"
}

message TunnelOpened {
  string connection_id = 1;
  bool ok = 2;
  string error = 3; // set only on failure
}

message TunnelData {
  string connection_id = 1;
  bytes data = 2; // raw bytes (max 16 KB chunks)
}

message TunnelClose {
  string connection_id = 1;
  string error = 2; // empty = clean close
}

message DiscoveredService {
  string protocol = 1; // "tcp"
  uint32 port = 2;
  string bound_ip = 3;
  string service_name = 4; // empty string if unknown port
}

message DiscoveryReport {
  string shield_id = 1;
  uint64 seq = 2; // monotonically increasing per shield session
  repeated DiscoveredService added = 3; // services that appeared since last report
  repeated DiscoveredService removed = 4; // only port + protocol are meaningful here
  uint64 fingerprint = 5; // hash over current full port set
  bool full_sync = 6; // true = replace-all, false = diff
}

message ShieldHealthReport {
  string version = 1;
  string hostname = 2;
  string public_ip = 3;
  string lan_ip = 4;
}

message ReEnrollSignal {}

message Ping {
  int64 timestamp_unix = 1;
}

message Pong {
  int64 timestamp_unix = 1;
}
