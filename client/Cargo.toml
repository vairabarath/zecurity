[package]
name = "zecurity-client"
version = "1.0.12"
edition = "2021"

[lib]
name = "zecurity_core"
path = "src/lib.rs"

[[bin]]
name = "zecurity-client"
path = "src/main.rs"


[dev-dependencies]
tempfile = "3"
# Paused-clock tests (tokio::test(start_paused = true)) for the FU-8 hint
# stream's reconnect backoff and idle limit. Test builds only.
tokio = { version = "1", features = ["test-util"] }
# Independent signature verification in the TPM tests: proves a TPM-produced
# signature validates against the TPM's public key under the exact algorithm
# rustls uses (ECDSA P-256 / SHA-256, ASN.1 DER signature). Already in the
# tree via rustls' "ring" feature.
ring = "0.17"

[dependencies]
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
toml       = "0.8"
dirs       = "5"
tokio      = { version = "1", features = ["full"] }
anyhow     = "1"
thiserror  = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

# Phase 2 — add now so they compile clean:
tonic      = { version = "0.12", features = ["tls"] }
prost      = "0.13"
rcgen      = "0.13"
sha2       = "0.10"
base64     = "0.22"
rand       = "0.8"
axum       = "0.7"
reqwest    = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
hostname   = "0.4"
urlencoding = "2"
serde_json         = "1"
libc               = "0.2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm     = "0.10"
x509-parser = { version = "0.18", features = ["verify"] }
parking_lot = "0.12"

# Phase 5 — add now so they compile clean:
tun         = { version = "0.6", features = ["async"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls       = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
rustls-pemfile = "2"

# Sprint 9 — Client TUN + QUIC pool:
quinn              = "0.11"
quinn-proto        = "0.11"
smoltcp            = { version = "0.11", features = ["proto-ipv4", "socket-tcp", "socket-udp"] }
futures            = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Sprint 9 TUN routing (tun.rs). Linux-only: netlink does not exist on Windows.
rtnetlink          = "0.14"
netlink-packet-route = "0.19"
# PENDING-17: hardware-backed device keys. Linux-only — never attempted on a
# hypothetical future non-Linux target.
tss-esapi = "7"
# DER-encode the TPM's raw ECDSA r/s components into an ECDSA-Sig-Value
# SEQUENCE — already in the dependency tree transitively via tss-esapi, this
# just makes them directly usable. Versions pinned to what tss-esapi already
# resolves to avoid a duplicate second copy in the build.
picky-asn1 = "0.10"
picky-asn1-der = "0.5"

# Opens the login page in the desktop browser; the Android app opens it itself
# (crate::mobile::set_url_opener).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
open = "5"

[target.'cfg(windows)'.dependencies]
# Windows client: the daemon runs as a Windows Service (win_service.rs), and
# the IPC named pipe gets an explicit security descriptor (ipc.rs).
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[build-dependencies]
tonic-build = "0.12"
# Validates the embedded platform root CA at build time (certificate audit bug 1).
x509-parser = { version = "0.18", features = ["verify"] }
