# protoc is installed on the GitHub Actions runner and volume-mounted into
# the cross container via CROSS_CONTAINER_OPTS — no apt-get needed.
[target.x86_64-unknown-linux-musl]

[target.aarch64-unknown-linux-musl]

# Certificate audit bug 1: build.rs embeds the platform root CA named by this
# variable (a path relative to the client crate, visible inside the container).
[build.env]
passthrough = ["ZECURITY_PLATFORM_ROOT_PEM_FILE"]
