[package]
name = "zecurity-ffi"
version = "1.0.12"
edition = "2021"
description = "Native library for the Zecurity mobile app: the client core behind a C ABI (Flutter, dart:ffi) and JNI (the Android VPN service)."

[lib]
name = "zecurity_ffi"
crate-type = ["cdylib"]

[dependencies]
zecurity-client = { path = ".." }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
